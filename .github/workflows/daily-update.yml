name: Actualizar datos de vivienda
on:
  schedule:
    - cron: '15 12 * * *' # ~07:15 Lima (UTC-5)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
      - name: Commit cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/source_state.json
          git diff --cached --quiet || git commit -m "chore: actualizar fuentes de vivienda"
          git push
